[package]
name = "seller-server"
version = "0.1.0"
edition = "2021"
description = "TaskAnchor seller server (Role B) — HTTP 402 flow + on-chain escrow verification"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"
thiserror = "1"
solana-pubkey = { version = "=2.2.1", features = ["curve25519"] }

# Pinned: solana-pubkey's own dependency chain will otherwise pull a zeroize
# release that requires a newer Cargo edition than this toolchain supports.
zeroize = "=1.8.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
